# Local profile — Postgres :5433.
# Infra: docker compose -f deployment/docker-compose-infra.yml up -d postgres

spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  config:
    import:
      - optional:classpath:platform/application-observability.yml
  datasource:
    url: jdbc:postgresql://localhost:5433/integration_db
    username: aisales
    password: aisales

management:
  tracing:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

aisales:
  security:
    jwt:
      public-key-location: classpath:jwt/local-public.pem
      key-id: aisales-1
  clients:
    lead-service:
      url: http://localhost:8083
  startup-validation:
    enabled: false

logging:
  level:
    com.aisales.integration: INFO
